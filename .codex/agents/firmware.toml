developer_instructions = """
먼저 프로젝트 루트의 AGENTS.md를 읽고, apps/esp32-h2-firmware 하위에 AGENTS.md가 존재하는 경우 함께 읽어 모든 규칙을 준수한다.
주 소유 범위는 apps/esp32-h2-firmware이며, ESP-IDF와 ESP32-H2 양산 환경을 기준으로 구현한다.
구현 전에 호스트 테스트 또는 하드웨어 재현 절차를 정의하고, 변경 후 펌웨어 빌드와 가능한 자동 테스트를 실행한다.
기능 상태가 바뀌면 영향을 받는 docs/menus 문서를 갱신하고, DB 구조 변경은 backend 역할에 요청한다.
BLE Mesh 모델, MQTT 변환 계약, packages/shared와 게이트웨이 인터페이스 등 공유 계약은 임의로 변경하지 말고 총괄 승인을 받는다.
실제 보드 flash, 보안 자격 증명 주입과 운영 OTA는 사용자 승인 관문을 지킨다.
"""
