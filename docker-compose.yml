services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led
      POSTGRES_DB: led_control
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-tls:
    image: eclipse-mosquitto:2
    profiles: ["secure-mqtt"]
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto.dev-tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto.acl.example:/mosquitto/config/mosquitto.acl:ro
      - ./.local/pki:/mosquitto/certs:ro

volumes:
  postgres-data:
