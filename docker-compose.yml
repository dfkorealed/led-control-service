services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: led
      POSTGRES_PASSWORD: led
      POSTGRES_DB: led_control
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mqtt-tls:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ${MOSQUITTO_TLS_CONFIG_PATH:-./infra/mosquitto.dev-tls.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto.acl.example:/mosquitto/config/mosquitto.acl:ro
      - ${MQTT_TLS_CERT_DIR:-./.local/pki}:/mosquitto/certs:ro

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-led-floor-assets}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-this-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - object-storage
    volumes:
      - ./infra/minio-cors.xml:/config/cors.xml:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://object-storage:9000 $${OBJECT_STORAGE_ACCESS_KEY:-led-floor-assets} $${OBJECT_STORAGE_SECRET_KEY:-change-this-local-secret}; do sleep 2; done;
      mc mb --ignore-existing local/floor-assets;
      mc anonymous set download local/floor-assets;
      mc cors set local/floor-assets /config/cors.xml;
      exit 0
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-led-floor-assets}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-this-local-secret}

volumes:
  postgres-data:
  object-storage-data:
