services:
  gateway-appliance:
    environment:
      GATEWAY_ADAPTER: bio-usb
      GATEWAY_BIO_USB_DEVICE: "${GATEWAY_BIO_USB_DEVICE:?BIO USB preflight device is required}"
      GATEWAY_BIO_USB_GID: "${GATEWAY_BIO_USB_GID:?BIO USB preflight group is required}"
    devices:
      - "${GATEWAY_BIO_USB_DEVICE}:${GATEWAY_BIO_USB_DEVICE}:rwm"
    group_add:
      - "${GATEWAY_BIO_USB_GID}"
    # setpriv가 bounding set을 완전히 비우기 위한 bootstrap capability다.
    # BIO entrypoint가 Node 실행 전에 제거하며 BlueZ 기본 compose에는 추가하지 않는다.
    cap_add:
      - SETPCAP
